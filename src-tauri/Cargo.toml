[package]
name = "netease-world-converter"
version = "1.2.0"
description = "网易 Minecraft 存档解密与 Java 版本转换器"
authors = ["Netease World Converter contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 关闭 default 中的 common-controls-v6：它让 muda/tauri-runtime-wry 静态导入
# comctl32 v6 的 TaskDialogIndirect，导致无清单的测试二进制以
# STATUS_ENTRYPOINT_NOT_FOUND 启动失败。本应用不使用菜单与原生消息框。
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1"
sha2 = "0.10"
walkdir = "2"
tempfile = "3"
regex = "1"
rfd = "0.15"
chrono = "0.4"
# system：内存探测（Chunker 堆大小）；disk：转换前的磁盘空间预检
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
# 区域验证与 LevelDB 解密的并行化
rayon = "1"
# 桌面目录走系统 Known Folder API（兼容 OneDrive 重定向）
dirs = "5"

[target.'cfg(windows)'.dependencies]
# 子进程 Job Object（取消时终止整棵进程树）；Win32_Security 为 CreateJobObjectW 的签名依赖
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lib]
name = "nwc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# 与 [dependencies] 同样关闭 default，避免特性合并重新引入 common-controls-v6
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
