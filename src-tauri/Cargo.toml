[package]
name = "netease-world-converter"
version = "1.0.0"
description = "网易 Minecraft 存档解密与 Java 版本转换器"
authors = ["Netease World Converter contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1"
sha2 = "0.10"
walkdir = "2"
tempfile = "3"
regex = "1"
rfd = "0.15"
chrono = "0.4"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[lib]
name = "nwc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
opt-level = 2
lto = false
strip = "symbols"
