[package]
name = "netease-world-converter"
version = "1.0.0"
description = "网易 Minecraft 存档解密与 Java 版本转换器"
authors = ["Netease World Converter contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 关闭 default 中的 common-controls-v6：它让 muda/tauri-runtime-wry 静态导入
# comctl32 v6 的 TaskDialogIndirect，导致无清单的测试二进制以
# STATUS_ENTRYPOINT_NOT_FOUND 启动失败。本应用不使用菜单与原生消息框。
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1"
sha2 = "0.10"
walkdir = "2"
tempfile = "3"
regex = "1"
rfd = "0.15"
chrono = "0.4"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[lib]
name = "nwc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# 与 [dependencies] 同样关闭 default，避免特性合并重新引入 common-controls-v6
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl"] }

[profile.release]
opt-level = 2
lto = false
strip = "symbols"
