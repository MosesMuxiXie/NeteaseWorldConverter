# release.yml — 多平台发布：Windows x64 / Windows arm64 / macOS x64 / macOS arm64
# 手动触发（Actions → Release builds → Run workflow）或打 v* tag 自动触发。
# tag 触发时最后会创建 GitHub Release 并附上全部安装包。

name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CHUNKER_JAR_URL: https://github.com/HiveGamesOSS/Chunker/releases/download/1.19.1/chunker-cli-1.19.1.jar
  JE2BE_VERSION: web-4.3.0
  JAVA_VERSION: "21"

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: x64 }
      - name: Prepare chunker-cli.jar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\backends | Out-Null
          Invoke-WebRequest "$env:CHUNKER_JAR_URL" -OutFile "src-tauri\backends\chunker-cli.jar"
      - name: Build b2j from source (x64)
        shell: pwsh
        run: |
          $src = "$env:TEMP\je2be"
          git clone --depth 1 --branch "$env:JE2BE_VERSION" https://github.com/kbinani/je2be-core.git $src
          cmake -S $src -B "$src\build" "-DCMAKE_BUILD_TYPE=Release" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          # 上游 /MP 与跨项目并行叠加会触发 MSVC D8040；串行 + 重试最稳
          $ok = $false
          foreach ($attempt in 1..3) {
            cmake --build "$src\build" --target b2j --config Release --parallel 1
            if (Test-Path "$src\build\Release\b2j.exe") { $ok = $true; break }
            Write-Warning "b2j 构建第 $attempt 次未产出，重试"
          }
          if (-not $ok) { throw "b2j 构建失败" }
          Copy-Item "$src\build\Release\b2j.exe" src-tauri\backends\ -Force
      - name: Prepare runtime (jlink)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri\runtime
          & "$env:JAVA_HOME\bin\jlink.exe" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri\runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-pc-windows-msvc }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: arm64 }
      - name: Prepare chunker-cli.jar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\backends | Out-Null
          Invoke-WebRequest "$env:CHUNKER_JAR_URL" -OutFile "src-tauri\backends\chunker-cli.jar"
      - name: Build b2j from source（优先原生 ARM64，失败回退 x64 经模拟运行）
        shell: pwsh
        run: |
          $src = "$env:TEMP\je2be"
          git clone --depth 1 --branch "$env:JE2BE_VERSION" https://github.com/kbinani/je2be-core.git $src
          # 上游 /MP 与跨项目并行叠加会触发 MSVC D8040；串行 + 重试最稳
          $ok = $false
          foreach ($attempt in 1..3) {
            if (-not (Test-Path "$src\build-arm64")) {
              cmake -S $src -B "$src\build-arm64" -A ARM64 "-DCMAKE_BUILD_TYPE=Release" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            }
            cmake --build "$src\build-arm64" --target b2j --config Release --parallel 1
            if (Test-Path "$src\build-arm64\Release\b2j.exe") { $ok = $true; break }
          }
          if ($ok) {
            Copy-Item "$src\build-arm64\Release\b2j.exe" src-tauri\backends\ -Force
            Write-Host "b2j: native ARM64"
          } else {
            Write-Warning "ARM64 b2j 构建失败，回退 x64（经 Win11 ARM 模拟层运行）"
            cmake -S $src -B "$src\build-x64" "-DCMAKE_BUILD_TYPE=Release" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            $ok = $false
            foreach ($attempt in 1..3) {
              cmake --build "$src\build-x64" --target b2j --config Release --parallel 1
              if (Test-Path "$src\build-x64\Release\b2j.exe") { $ok = $true; break }
            }
            if (-not $ok) { throw "b2j x64 回退构建失败" }
            Copy-Item "$src\build-x64\Release\b2j.exe" src-tauri\backends\ -Force
          }
      - name: Prepare runtime (jlink arm64)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri\runtime
          & "$env:JAVA_HOME\bin\jlink.exe" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri\runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target aarch64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

  macos-x64:
    runs-on: macos-14 # arm64 运行器 + Rosetta 2 交叉构建 Intel 产物
    env:
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-apple-darwin }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: x64 }
      - name: Prepare chunker-cli.jar
        run: |
          mkdir -p src-tauri/backends
          curl -L "$CHUNKER_JAR_URL" -o src-tauri/backends/chunker-cli.jar
      - name: Build b2j from source (je2be-core, CMake)
        run: bash scripts/build-b2j-macos.sh "$JE2BE_VERSION"
      - name: Prepare runtime (jlink)
        run: |
          rm -rf src-tauri/runtime
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri/runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app

  macos-arm64:
    runs-on: macos-14 # Apple Silicon 运行器
    env:
      ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: aarch64 }
      - name: Prepare chunker-cli.jar
        run: |
          mkdir -p src-tauri/backends
          curl -L "$CHUNKER_JAR_URL" -o src-tauri/backends/chunker-cli.jar
      - name: Build b2j from source (je2be-core, CMake)
        run: bash scripts/build-b2j-macos.sh "$JE2BE_VERSION"
      - name: Prepare runtime (jlink)
        run: |
          rm -rf src-tauri/runtime
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri/runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

  release:
    needs: [windows-x64, windows-arm64, macos-x64, macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
