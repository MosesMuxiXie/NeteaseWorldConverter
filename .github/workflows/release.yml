# release.yml — 多平台发布：Windows x64 / Windows arm64 / macOS x64 / macOS arm64 / Linux x64
# 手动触发（Actions → Release builds → Run workflow）或打 v* tag 自动触发。
# tag 触发时最后会创建 GitHub Release 并附上全部安装包。

name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CHUNKER_JAR_URL: https://github.com/HiveGamesOSS/Chunker/releases/download/1.19.1/chunker-cli-1.19.1.jar
  JE2BE_VERSION: web-4.3.0
  JAVA_VERSION: "21"

jobs:
  # 先跑测试与静态检查，全部通过后才开始构建发布产物
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Frontend workflow tests
        run: node scripts/ui-flow-test.mjs
      - name: Conversion benchmark tests
        run: node --test scripts/bench-b2j.test.mjs scripts/profile-conversion.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy,rustfmt" }
      - name: Install Linux system deps (tauri 编译需要 GTK/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-x64:
    needs: verify
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: x64 }
      - name: Prepare chunker-cli.jar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\backends | Out-Null
          Invoke-WebRequest "$env:CHUNKER_JAR_URL" -OutFile "src-tauri\backends\chunker-cli.jar"
      - name: Copy vendored b2j (x64)
        shell: pwsh
        run: |
          Copy-Item vendor\backends-windows\b2j.exe src-tauri\backends\ -Force
          Copy-Item vendor\backends-windows\libc++.dll src-tauri\backends\ -Force
          Copy-Item vendor\backends-windows\libunwind.dll src-tauri\backends\ -Force
      - name: Prepare runtime (jlink)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri\runtime
          & "$env:JAVA_HOME\bin\jlink.exe" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri\runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  windows-arm64:
    needs: verify
    runs-on: windows-11-arm # 原生 ARM 运行器：arm64 jlink / 编译器均可直接运行
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-pc-windows-msvc }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: arm64 }
      - name: Prepare chunker-cli.jar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\backends | Out-Null
          Invoke-WebRequest "$env:CHUNKER_JAR_URL" -OutFile "src-tauri\backends\chunker-cli.jar"
      - name: Try native arm64 b2j from source (best effort)
        continue-on-error: true
        shell: bash
        run: bash scripts/build-b2j-windows-arm64.sh "$JE2BE_VERSION"
      - name: Select b2j (native arm64 if built, else vendored x64 via emulation)
        shell: pwsh
        run: |
          if (Test-Path "src-tauri\backends\b2j-arm64-native.exe") {
            Move-Item "src-tauri\backends\b2j-arm64-native.exe" "src-tauri\backends\b2j.exe" -Force
            Write-Host "使用原生 arm64 b2j（源码构建）"
          } else {
            Copy-Item vendor\backends-windows\b2j.exe src-tauri\backends\ -Force
            Copy-Item vendor\backends-windows\libc++.dll src-tauri\backends\ -Force
            Copy-Item vendor\backends-windows\libunwind.dll src-tauri\backends\ -Force
            Write-Host "回退 vendored x64 b2j（经 Win11 ARM 模拟层运行）"
          }
      - name: Prepare runtime (jlink arm64)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri\runtime
          & "$env:JAVA_HOME\bin\jlink.exe" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri\runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target aarch64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe.sig

  macos-x64:
    needs: verify
    runs-on: macos-14 # arm64 运行器 + Rosetta 2 交叉构建 Intel 产物
    env:
      ARCH: x86_64
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-apple-darwin }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: x64 }
      - name: Prepare chunker-cli.jar
        run: |
          mkdir -p src-tauri/backends
          curl -L "$CHUNKER_JAR_URL" -o src-tauri/backends/chunker-cli.jar
      - name: Build b2j from source (je2be-core, CMake)
        run: bash scripts/build-b2j-macos.sh "$JE2BE_VERSION"
      - name: Prepare runtime (jlink)
        run: |
          rm -rf src-tauri/runtime
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri/runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target x86_64-apple-darwin
      - name: Name updater artifact by architecture
        run: |
          cd src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          mv NeteaseWorldConverter.app.tar.gz NeteaseWorldConverter_x64.app.tar.gz
          mv NeteaseWorldConverter.app.tar.gz.sig NeteaseWorldConverter_x64.app.tar.gz.sig
      # 只上传 dmg：.app 是目录，upload-artifact 会把它摊平成散文件，
      # 在 release 步骤与其他产物同名冲突（LICENSE 等）导致发布失败
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz.sig

  macos-arm64:
    needs: verify
    runs-on: macos-14 # Apple Silicon 运行器
    env:
      ARCH: arm64
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: aarch64 }
      - name: Prepare chunker-cli.jar
        run: |
          mkdir -p src-tauri/backends
          curl -L "$CHUNKER_JAR_URL" -o src-tauri/backends/chunker-cli.jar
      - name: Build b2j from source (je2be-core, CMake)
        run: bash scripts/build-b2j-macos.sh "$JE2BE_VERSION"
      - name: Prepare runtime (jlink)
        run: |
          rm -rf src-tauri/runtime
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri/runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target aarch64-apple-darwin
      - name: Name updater artifact by architecture
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          mv NeteaseWorldConverter.app.tar.gz NeteaseWorldConverter_arm64.app.tar.gz
          mv NeteaseWorldConverter.app.tar.gz.sig NeteaseWorldConverter_arm64.app.tar.gz.sig
      # 同上：只上传 dmg，避免 .app 散文件污染 release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz.sig

  linux-x64:
    needs: verify
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: x64 }
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev cmake ninja-build libfuse2 patchelf
      - name: Prepare chunker-cli.jar
        run: |
          mkdir -p src-tauri/backends
          curl -fL "$CHUNKER_JAR_URL" -o src-tauri/backends/chunker-cli.jar
      - name: Build Linux b2j from source
        run: bash scripts/build-b2j-linux.sh "$JE2BE_VERSION"
      - name: Prepare runtime (jlink)
        run: |
          rm -rf src-tauri/runtime
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri/runtime
      - name: Exclude bundled JRE libs from linuxdeploy scan
        run: |
          set -euo pipefail
          # linuxdeploy 会扫描 AppDir 内的 ELF 并解析依赖；jlink 运行时自带的
          # libjvm.so / libjli.so 等私有库互相引用，ldd 无法从各自 RUNPATH 解析，
          # 默认会以 “Could not find dependency: libjvm.so” 终止打包。
          # 这些库由随包 JRE 提供，应让 linuxdeploy 直接跳过。
          libs=$(find src-tauri/runtime -type f -name '*.so*' -printf '%f\n' | sed -E 's/\.so.*$/.so/' | sort -u | paste -sd';')
          if [ -z "$libs" ]; then echo "未找到 jlink 运行时库"; exit 1; fi
          echo "LINUXDEPLOY_EXCLUDED_LIBRARIES=$libs" >> "$GITHUB_ENV"
          echo "excluded from linuxdeploy: $libs"
      - run: npm ci --no-audit --no-fund
      - name: Pin linuxdeploy build that honors LINUXDEPLOY_EXCLUDED_LIBRARIES
        run: |
          set -euo pipefail
          # Tauri 自带的 linuxdeploy 快照（2024-07-26）不读取排除变量，
          # 遇到随包 JRE 的 libjvm.so 会直接以
          # “Could not find dependency: libjvm.so” 终止打包。
          # 预置带该支持的 continuous 构建（2026-08-01）到 Tauri 的缓存路径：
          # Tauri 只在文件不存在时才下载，因此这里放好后即被使用；
          # 并用 sha256 固定内容，上游替换产物时构建会显式失败而不是静默换版。
          target="$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"
          mkdir -p "$(dirname "$target")"
          curl -fL --retry 3 -o "$target" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          echo "36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62  $target" | sha256sum -c -
          chmod +x "$target"
          ls -l "$target"
      - name: Build deb and AppImage bundles
        env:
          # linuxdeploy 及其插件本身都是 AppImage：无 FUSE 时靠解包运行
          # （Tauri 内部也会设置该变量，这里显式写出便于排障）。
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # 预防性保留：上游对 strip 在 .relr.dyn 段上失败的 workaround。
          # 本次打包失败的直接原因不是它，而是上面被排除的 JRE 库依赖解析。
          NO_STRIP: "1"
        # -v：默认日志级别下 Tauri 只报 “failed to run linuxdeploy”，
        # 会丢弃 linuxdeploy 的 stderr；详细日志才能定位失败原因。
        run: npx tauri build -v --target x86_64-unknown-linux-gnu --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig

  release:
    needs: [windows-x64, windows-arm64, macos-x64, macos-arm64, linux-x64, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build updater manifest
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path("artifacts")
          tag = os.environ["TAG"]
          repo = os.environ["REPOSITORY"]

          def updater(dir_name, pattern):
              matches = list((root / dir_name).rglob(pattern))
              if len(matches) != 1:
                  raise SystemExit(f"expected one {dir_name}/{pattern}, found {matches}")
              sig = matches[0]
              bundle = Path(str(sig)[:-4])
              if not bundle.is_file():
                  raise SystemExit(f"missing updater bundle for {sig}")
              return {
                  "signature": sig.read_text(encoding="utf-8").strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{bundle.name}",
              }

          manifest = {
              "version": tag.removeprefix("v"),
              "notes": "NeteaseWorldConverter " + tag,
              "pub_date": None,
              "platforms": {
                  "windows-x86_64": updater("windows-x64", "*.exe.sig"),
                  "windows-aarch64": updater("windows-arm64", "*.exe.sig"),
                  "darwin-x86_64": updater("macos-x64", "*.tar.gz.sig"),
                  "darwin-aarch64": updater("macos-arm64", "*.tar.gz.sig"),
                  "linux-x86_64": updater("linux-x64", "*.AppImage.sig"),
              },
          }
          (root / "latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          name: NeteaseWorldConverter ${{ github.ref_name }}
          body_path: RELEASE.md
