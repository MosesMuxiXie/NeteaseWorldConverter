# release.yml — 多平台发布：Windows x64 / Windows arm64 / macOS x64 / macOS arm64
# 手动触发（Actions → Release builds → Run workflow）或打 v* tag 自动触发。
# tag 触发时最后会创建 GitHub Release 并附上全部安装包。

name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CHUNKER_JAR_URL: https://github.com/HiveGamesOSS/Chunker/releases/download/1.19.1/chunker-cli-1.19.1.jar
  JE2BE_VERSION: web-4.3.0
  JAVA_VERSION: "21"

jobs:
  # 先跑测试与静态检查，全部通过后才开始构建发布产物
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Frontend workflow tests
        run: node scripts/ui-flow-test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy,rustfmt" }
      - name: Install Linux system deps (tauri 编译需要 GTK/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-x64:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: x64 }
      - name: Prepare chunker-cli.jar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\backends | Out-Null
          Invoke-WebRequest "$env:CHUNKER_JAR_URL" -OutFile "src-tauri\backends\chunker-cli.jar"
      - name: Copy vendored b2j (x64)
        shell: pwsh
        run: |
          Copy-Item vendor\backends-windows\b2j.exe src-tauri\backends\ -Force
          Copy-Item vendor\backends-windows\libc++.dll src-tauri\backends\ -Force
          Copy-Item vendor\backends-windows\libunwind.dll src-tauri\backends\ -Force
      - name: Prepare runtime (jlink)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri\runtime
          & "$env:JAVA_HOME\bin\jlink.exe" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri\runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  windows-arm64:
    needs: verify
    runs-on: windows-11-arm # 原生 ARM 运行器：arm64 jlink / 编译器均可直接运行
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-pc-windows-msvc }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: arm64 }
      - name: Prepare chunker-cli.jar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\backends | Out-Null
          Invoke-WebRequest "$env:CHUNKER_JAR_URL" -OutFile "src-tauri\backends\chunker-cli.jar"
      - name: Try native arm64 b2j from source (best effort)
        continue-on-error: true
        shell: bash
        run: bash scripts/build-b2j-windows-arm64.sh "$JE2BE_VERSION"
      - name: Select b2j (native arm64 if built, else vendored x64 via emulation)
        shell: pwsh
        run: |
          if (Test-Path "src-tauri\backends\b2j-arm64-native.exe") {
            Move-Item "src-tauri\backends\b2j-arm64-native.exe" "src-tauri\backends\b2j.exe" -Force
            Write-Host "使用原生 arm64 b2j（源码构建）"
          } else {
            Copy-Item vendor\backends-windows\b2j.exe src-tauri\backends\ -Force
            Copy-Item vendor\backends-windows\libc++.dll src-tauri\backends\ -Force
            Copy-Item vendor\backends-windows\libunwind.dll src-tauri\backends\ -Force
            Write-Host "回退 vendored x64 b2j（经 Win11 ARM 模拟层运行）"
          }
      - name: Prepare runtime (jlink arm64)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri\runtime
          & "$env:JAVA_HOME\bin\jlink.exe" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri\runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target aarch64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

  macos-x64:
    needs: verify
    runs-on: macos-14 # arm64 运行器 + Rosetta 2 交叉构建 Intel 产物
    env:
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-apple-darwin }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: x64 }
      - name: Prepare chunker-cli.jar
        run: |
          mkdir -p src-tauri/backends
          curl -L "$CHUNKER_JAR_URL" -o src-tauri/backends/chunker-cli.jar
      - name: Build b2j from source (je2be-core, CMake)
        run: bash scripts/build-b2j-macos.sh "$JE2BE_VERSION"
      - name: Prepare runtime (jlink)
        run: |
          rm -rf src-tauri/runtime
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri/runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target x86_64-apple-darwin
      # 只上传 dmg：.app 是目录，upload-artifact 会把它摊平成散文件，
      # 在 release 步骤与其他产物同名冲突（LICENSE 等）导致发布失败
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  macos-arm64:
    needs: verify
    runs-on: macos-14 # Apple Silicon 运行器
    env:
      ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", architecture: aarch64 }
      - name: Prepare chunker-cli.jar
        run: |
          mkdir -p src-tauri/backends
          curl -L "$CHUNKER_JAR_URL" -o src-tauri/backends/chunker-cli.jar
      - name: Build b2j from source (je2be-core, CMake)
        run: bash scripts/build-b2j-macos.sh "$JE2BE_VERSION"
      - name: Prepare runtime (jlink)
        run: |
          rm -rf src-tauri/runtime
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --no-header-files --no-man-pages --compress=zip-9 --output src-tauri/runtime
      - run: npm install --no-audit --no-fund
      - name: Build bundles
        run: npx tauri build --target aarch64-apple-darwin
      # 同上：只上传 dmg，避免 .app 散文件污染 release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  release:
    needs: [windows-x64, windows-arm64, macos-x64, macos-arm64, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          name: NeteaseWorldConverter ${{ github.ref_name }}
          body_path: RELEASE.md
